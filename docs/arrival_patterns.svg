<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .ttl{font-size:17px;font-weight:700;fill:#0f172a}
      .sub{font-size:12px;fill:#64748b}
      .bn{font-size:13px;font-weight:700;fill:#0f172a}
      .bs{font-size:10px;fill:#64748b}
      .ax{font-size:10px;fill:#64748b}
      .ul{font-size:10px;font-weight:600;fill:#334155}
      .ln{stroke:#cbd5e1;stroke-width:1.4}
      .tick{stroke:#94a3b8;stroke-width:1.2}
    </style>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="360" fill="#ffffff"/>
  <text x="24" y="32" class="ttl">User arrival scheduling</text>
  <text x="24" y="50" class="sub">How the N users ramp up before they start their independent multi-turn conversations. Time runs left → right.</text>

  <!-- time axis geometry: t=0 at x=110, t=10s at x=810 (70px/s) -->
  <!-- burst -->
  <g transform="translate(0,90)">
    <text x="24" y="14" class="bn">burst</text>
    <text x="24" y="30" class="bs">all users at t=0</text>
    <line x1="110" y1="20" x2="820" y2="20" class="ln" marker-end="url(#ah3)"/>
    <!-- 5 users stacked at t=0 -->
    <g fill="#6366f1">
      <line x1="110" y1="20" x2="110" y2="-6" class="tick" stroke="#6366f1"/>
      <circle cx="110" cy="-6" r="5"/>
      <circle cx="110" cy="-14" r="5" opacity=".75"/>
      <circle cx="110" cy="-22" r="5" opacity=".55"/>
      <circle cx="110" cy="-30" r="5" opacity=".4"/>
      <circle cx="110" cy="-38" r="5" opacity=".28"/>
    </g>
    <text x="124" y="-26" class="ul">all 5 users start now</text>
  </g>

  <!-- steady:2 -->
  <g transform="translate(0,170)">
    <text x="24" y="14" class="bn">steady:2</text>
    <text x="24" y="30" class="bs">one user every 2s</text>
    <line x1="110" y1="20" x2="820" y2="20" class="ln" marker-end="url(#ah3)"/>
    <!-- arrivals at 0,2,4,6,8 -->
    <g fill="#0ea5e9">
      <line x1="110" y1="20" x2="110" y2="-6" stroke="#0ea5e9" stroke-width="1.2"/><circle cx="110" cy="-6" r="5"/>
      <line x1="250" y1="20" x2="250" y2="-6" stroke="#0ea5e9" stroke-width="1.2"/><circle cx="250" cy="-6" r="5"/>
      <line x1="390" y1="20" x2="390" y2="-6" stroke="#0ea5e9" stroke-width="1.2"/><circle cx="390" cy="-6" r="5"/>
      <line x1="530" y1="20" x2="530" y2="-6" stroke="#0ea5e9" stroke-width="1.2"/><circle cx="530" cy="-6" r="5"/>
      <line x1="670" y1="20" x2="670" y2="-6" stroke="#0ea5e9" stroke-width="1.2"/><circle cx="670" cy="-6" r="5"/>
    </g>
    <text x="124" y="-10" class="ul">evenly spaced</text>
  </g>

  <!-- poisson:0.5 -->
  <g transform="translate(0,250)">
    <text x="24" y="14" class="bn">poisson:0.5</text>
    <text x="24" y="30" class="bs">exponential gaps</text>
    <line x1="110" y1="20" x2="820" y2="20" class="ln" marker-end="url(#ah3)"/>
    <!-- arrivals at 0, 1.4, 3.0, 4.8, 7.2 (x = 110 + t*70) -->
    <g fill="#f59e0b">
      <line x1="110" y1="20" x2="110" y2="-6" stroke="#f59e0b" stroke-width="1.2"/><circle cx="110" cy="-6" r="5"/>
      <line x1="208" y1="20" x2="208" y2="-6" stroke="#f59e0b" stroke-width="1.2"/><circle cx="208" cy="-6" r="5"/>
      <line x1="320" y1="20" x2="320" y2="-6" stroke="#f59e0b" stroke-width="1.2"/><circle cx="320" cy="-6" r="5"/>
      <line x1="446" y1="20" x2="446" y2="-6" stroke="#f59e0b" stroke-width="1.2"/><circle cx="446" cy="-6" r="5"/>
      <line x1="614" y1="20" x2="614" y2="-6" stroke="#f59e0b" stroke-width="1.2"/><circle cx="614" cy="-6" r="5"/>
    </g>
    <text x="124" y="-10" class="ul">irregular, memoryless gaps</text>
  </g>

  <!-- shared time axis ticks (under poisson band) -->
  <g transform="translate(0,270)">
    <line x1="110" y1="14" x2="820" y2="14" stroke="#e2e8f0"/>
    <g class="ax" text-anchor="middle">
      <line x1="110" y1="14" x2="110" y2="20" class="tick"/><text x="110" y="34">0s</text>
      <line x1="250" y1="14" x2="250" y2="20" class="tick"/><text x="250" y="34">2s</text>
      <line x1="390" y1="14" x2="390" y2="20" class="tick"/><text x="390" y="34">4s</text>
      <line x1="530" y1="14" x2="530" y2="20" class="tick"/><text x="530" y="34">6s</text>
      <line x1="670" y1="14" x2="670" y2="20" class="tick"/><text x="670" y="34">8s</text>
      <line x1="810" y1="14" x2="810" y2="20" class="tick"/><text x="810" y="34">10s</text>
    </g>
    <text x="820" y="34" class="ax"> time</text>
  </g>
</svg>
