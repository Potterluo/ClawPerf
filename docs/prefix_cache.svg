<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .ttl{font-size:17px;font-weight:700;fill:#0f172a}
      .sub{font-size:12px;fill:#64748b}
      .node{font-size:11px;font-weight:600;fill:#0f172a}
      .hit{font-size:11px;font-weight:700;fill:#10b981}
      .miss{font-size:11px;font-weight:700;fill:#ef4444}
      .note{font-size:11px;fill:#334155}
      .ln{stroke:#94a3b8;stroke-width:1.4;fill:none}
      .pill{fill:#f1f5f9;stroke:#cbd5e1}
      .ptxt{font-size:11px;font-weight:600;fill:#334155}
    </style>
  </defs>

  <rect width="880" height="440" fill="#ffffff"/>

  <text x="24" y="34" class="ttl">Prefix cache reuse across turns (HBM trie)</text>
  <text x="24" y="52" class="sub">Token-level hit rate = reused tokens / queried tokens. Each turn matches the longest cached prefix, then stores the rest.</text>

  <!-- Turn 1 -->
  <g transform="translate(24,82)">
    <text x="0" y="0" class="ptxt">Turn 1</text>
    <text x="0" y="16" class="note">prompt: [sys][u][q1] — nothing cached</text>
    <!-- trie nodes -->
    <circle cx="20" cy="50" r="12" fill="#fff" stroke="#94a3b8"/>
    <text x="20" y="54" text-anchor="middle" class="node">sys</text>
    <line x1="20" y1="62" x2="20" y2="84" class="ln"/>
    <circle cx="20" cy="96" r="12" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="20" y="100" text-anchor="middle" class="node">u</text>
    <line x1="20" y1="108" x2="20" y2="130" class="ln"/>
    <circle cx="20" cy="142" r="12" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="20" y="146" text-anchor="middle" class="node">q1</text>
    <text x="40" y="146" class="miss">miss → insert all</text>
    <text x="0" y="172" class="note">hit tokens: 0   (cold start)</text>
  </g>

  <!-- Turn 2 -->
  <g transform="translate(300,82)">
    <text x="0" y="0" class="ptxt">Turn 2</text>
    <text x="0" y="16" class="note">prompt: [sys][u][q1][a1][q2]</text>
    <!-- cached prefix (green) -->
    <circle cx="20" cy="50" r="12" fill="#d1fae5" stroke="#10b981"/>
    <text x="20" y="54" text-anchor="middle" class="node">sys</text>
    <line x1="20" y1="62" x2="20" y2="84" class="ln"/>
    <circle cx="20" cy="96" r="12" fill="#d1fae5" stroke="#10b981"/>
    <text x="20" y="100" text-anchor="middle" class="node">u</text>
    <line x1="20" y1="108" x2="20" y2="130" class="ln"/>
    <circle cx="20" cy="142" r="12" fill="#d1fae5" stroke="#10b981"/>
    <text x="20" y="146" text-anchor="middle" class="node">q1</text>
    <line x1="20" y1="154" x2="20" y2="176" class="ln" stroke-dasharray="4 3"/>
    <circle cx="20" cy="188" r="12" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="20" y="192" text-anchor="middle" class="node">a1</text>
    <text x="40" y="146" class="hit">cached prefix matched</text>
    <text x="40" y="192" class="miss">miss → insert a1, q2</text>
    <text x="0" y="222" class="note">hit tokens: sys+u+q1 (reused)</text>
  </g>

  <!-- Turn 3 -->
  <g transform="translate(560,82)">
    <text x="0" y="0" class="ptxt">Turn 3</text>
    <text x="0" y="16" class="note">prompt: [sys][u][q1][a1][q2][a2][q3]</text>
    <circle cx="20" cy="50" r="12" fill="#d1fae5" stroke="#10b981"/>
    <text x="20" y="54" text-anchor="middle" class="node">sys</text>
    <line x1="20" y1="62" x2="20" y2="80" class="ln"/>
    <circle cx="20" cy="92" r="12" fill="#d1fae5" stroke="#10b981"/>
    <text x="20" y="96" text-anchor="middle" class="node">u</text>
    <line x1="20" y1="104" x2="20" y2="118" class="ln"/>
    <circle cx="20" cy="130" r="12" fill="#d1fae5" stroke="#10b981"/>
    <text x="20" y="134" text-anchor="middle" class="node">q1</text>
    <line x1="20" y1="142" x2="20" y2="156" class="ln"/>
    <circle cx="20" cy="168" r="12" fill="#d1fae5" stroke="#10b981"/>
    <text x="20" y="172" text-anchor="middle" class="node">a1</text>
    <line x1="20" y1="180" x2="20" y2="194" class="ln"/>
    <circle cx="20" cy="206" r="12" fill="#d1fae5" stroke="#10b981"/>
    <text x="20" y="210" text-anchor="middle" class="node">q2</text>
    <text x="40" y="206" class="hit">longer prefix matched</text>
    <text x="0" y="240" class="note">hit tokens: sys+u+q1+a1+q2</text>
  </g>

  <!-- legend / metric -->
  <g transform="translate(24,350)">
    <rect x="0" y="0" width="832" height="74" rx="8" class="pill"/>
    <text x="16" y="24" class="ptxt">What we measure</text>
    <text x="16" y="44" class="note">• prefix_cache_token_hit_rate = Σ reused tokens / Σ queried tokens across the run (token-level, not request-level binary).</text>
    <text x="16" y="60" class="note">• Two-tier: HBM trie (GPU KV) queried first; external trie (CPU/disk) on HBM miss. LRU eviction by complete request path with ref-counted shared prefixes.</text>
    <circle cx="780" cy="40" r="7" fill="#d1fae5" stroke="#10b981"/>
    <text x="794" y="44" class="note">hit</text>
    <circle cx="780" cy="58" r="7" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="794" y="62" class="note">new</text>
  </g>
</svg>
